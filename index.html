<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="ALBANA">
<meta name="description" content="ALBANA collection index for timestamp-based album structural analysis.">
<meta property="og:site_name" content="ALBANA">
<meta property="og:title" content="ALBANA — structural album analysis">
<meta property="og:description" content="Timestamp-based structural analysis for landmark electronic, ambient, and soundtrack albums.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>ALBANA Index</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./src/album-analysis.css">
</head>
<body data-collection="home" class="min-h-screen bg-base-100 text-base-content antialiased">

<a class="skip-link" href="#main">Skip to content</a>

<header id="ixHero"></header>

<main id="main" class="container pb-20">
  <div class="ix-results-bar">
    <span class="ix-count badge badge-ghost badge-lg h-auto rounded-full px-4 py-3" id="ixCount"></span>
    <div class="ix-active-filters" id="ixActiveFilters"></div>
    <label class="ix-sort" for="ixSort">
      <span class="ix-sort-label">Sort</span>
      <select class="ix-sort-select select select-sm select-bordered border-base-300/60 bg-base-100/40 rounded-full" id="ixSort" aria-label="Sort albums">
        <option value="year-asc">Year ↑</option>
        <option value="year-desc">Year ↓</option>
        <option value="artist-asc">Artist A–Z</option>
        <option value="title-asc">Title A–Z</option>
        <option value="tracks-desc">Most tracks</option>
      </select>
    </label>
  </div>
  <div class="ix-grid" id="ixGrid"></div>
</main>

<div id="siteFooter"></div>

<script type="module" src="./src/index.ts"></script>

</body>
</html>
