<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="ALBANA">
<meta name="description" content="ALBANA collection index for timestamp-based album structural analysis.">
<title>ALBANA Index</title>
<link rel="stylesheet" href="./src/album-analysis.css">
</head>
<body data-collection="home" class="min-h-screen bg-base-100 text-base-content antialiased">

<header id="ixHero"></header>

<main class="container pb-20">
  <div class="ix-results-bar">
    <span class="ix-count badge badge-ghost badge-lg h-auto rounded-full px-4 py-3" id="ixCount"></span>
  </div>
  <div class="ix-grid" id="ixGrid"></div>
</main>

<div id="siteFooter"></div>

<!--
  src/index.ts fetches data/index.json, which is derived from data/*.json.
  Album metadata is no longer hardcoded in a root manifest.
-->
<script type="module" src="./src/index.ts"></script>

</body>
</html>
