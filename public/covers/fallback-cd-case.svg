<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fallback album cover</title>
  <desc id="desc">A black compact disc case with a silver disc inside.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111214"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181b"/>
      <stop offset="52%" stop-color="#070809"/>
      <stop offset="100%" stop-color="#1d2024"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b2f34"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="disc" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="24%" stop-color="#d9dee3"/>
      <stop offset="58%" stop-color="#a0a6ad"/>
      <stop offset="100%" stop-color="#686d74"/>
    </radialGradient>
    <radialGradient id="discHighlight" cx="34%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect x="110" y="110" width="980" height="980" rx="56" fill="url(#case)" stroke="#363a40" stroke-width="10"/>
  <rect x="165" y="165" width="870" height="870" rx="38" fill="#050607" stroke="#21242a" stroke-width="6"/>
  <rect x="165" y="165" width="870" height="870" rx="38" fill="url(#plastic)"/>
  <rect x="165" y="165" width="126" height="870" rx="20" fill="url(#spine)" opacity="0.92"/>

  <g opacity="0.18">
    <line x1="228" y1="165" x2="228" y2="1035" stroke="#ffffff" stroke-width="3"/>
    <line x1="975" y1="165" x2="975" y2="1035" stroke="#ffffff" stroke-width="2"/>
    <line x1="165" y1="228" x2="1035" y2="228" stroke="#ffffff" stroke-width="2"/>
    <line x1="165" y1="972" x2="1035" y2="972" stroke="#ffffff" stroke-width="2"/>
  </g>

  <circle cx="664" cy="600" r="316" fill="url(#disc)" stroke="#d8dde2" stroke-width="10"/>
  <circle cx="664" cy="600" r="256" fill="none" stroke="#8f959d" stroke-width="10" opacity="0.7"/>
  <circle cx="664" cy="600" r="162" fill="none" stroke="#f4f7fa" stroke-width="8" opacity="0.48"/>
  <circle cx="664" cy="600" r="84" fill="#1d2125" stroke="#d7dce1" stroke-width="10"/>
  <circle cx="664" cy="600" r="28" fill="#eceff2"/>
  <circle cx="664" cy="600" r="316" fill="url(#discHighlight)" opacity="0.42"/>

  <path d="M664 284a316 316 0 0 1 273 157" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="18" stroke-linecap="round"/>
  <path d="M409 728a316 316 0 0 0 185 159" fill="none" stroke="#a1d6ff" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round"/>

  <rect x="176" y="176" width="848" height="126" rx="26" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="176" y="176" width="848" height="848" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
</svg>