<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soundtracks | Album Analysis</title>
<link rel="stylesheet" href="./src/album-analysis.css">
</head>
<body data-collection="soundtracks" class="min-h-screen bg-base-100 text-base-content antialiased">

<header class="ix-hero">
  <div class="container">
    <div class="card border border-base-300/70 bg-base-200/85 shadow-2xl backdrop-blur-xl">
      <div class="card-body items-center gap-5 px-6 py-8 text-center sm:px-10 sm:py-12">
        <div class="badge badge-outline badge-accent subtitle px-4 py-3 font-mono text-[0.68rem] uppercase tracking-[0.28em]">
          Editorial Collection
        </div>
        <h1 class="font-display text-4xl font-semibold tracking-[-0.04em] text-base-content sm:text-5xl lg:text-6xl 2xl:text-7xl">
          Soundtracks
        </h1>
        <p class="max-w-3xl text-sm font-mono uppercase tracking-[0.22em] text-base-content/55 sm:text-[0.78rem]">
          Chronological soundtrack picks with the same structural-analysis workflow
        </p>
        <div id="siteNav"></div>
        <label class="input input-bordered flex w-full max-w-2xl items-center gap-3 border-base-300 bg-base-100/80 px-4 shadow-lg">
          <span class="text-base-content/45" aria-hidden="true">⌕</span>
          <input type="search" class="ix-search grow bg-transparent text-sm outline-none sm:text-base" id="ixSearch"
                 placeholder="Search soundtracks by title, artist or genre…"
                 autocomplete="off" spellcheck="false" aria-label="Filter soundtracks">
        </label>
        <div class="ix-filters" id="ixFilters"></div>
      </div>
    </div>
  </div>
</header>

<main class="container pb-20">
  <div class="ix-results-bar">
    <span class="ix-count badge badge-ghost badge-lg h-auto rounded-full px-4 py-3" id="ixCount"></span>
  </div>
  <div class="ix-grid" id="ixGrid"></div>
</main>

<div id="siteFooter"></div>

<!--
  src/index.ts fetches data/index.json, which is derived from data/*.json.
  Album metadata is no longer hardcoded in a root manifest.
-->
<script type="module" src="./src/index.ts"></script>

</body>
</html>
